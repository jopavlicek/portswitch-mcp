# "Old" project: a small stack (db + worker). The db keeps its data in an anonymous volume
# (no `volumes:` entry), so even a plain `docker compose down` would delete it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    image: python:3.12-alpine
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
