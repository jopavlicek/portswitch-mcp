# The project the agent has to start: web app on 8080 plus its own PostgreSQL on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    image: python:3.12-alpine
    command: python /app/health.py
    environment:
      DB_HOST: db
    volumes:
      - ./health.py:/app/health.py:ro
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
